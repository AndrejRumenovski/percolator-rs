[package]
name = "percolator-rs"
version = "0.1.0"
edition = "2021"
description = "A from-scratch Rust reimplementation of the Percolator semi-supervised PSM rescoring algorithm"
repository = "https://github.com/AndrejRumenovski/percolator-rs"
license = "MIT"
readme = "README.md"
keywords = ["proteomics", "mass-spectrometry", "percolator", "fdr", "svm"]
categories = ["science", "command-line-utilities"]

[features]
profiling = ["dep:pprof"]

[[bin]]
name = "percolator-rs"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
ctrlc = "3.4"
fs2 = "0.4"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha1 = "0.10"
sha2 = "0.10"
libc = "0.2"
ahash = "0.8.12"
fast-float = "0.2.0"
glob = "0.3"
memmap2 = "0.9.11"
pprof = { version = "0.15", features = ["flamegraph", "protobuf-codec"], optional = true }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
wide = "1.6.1"

[dev-dependencies]
tempfile = "3"
